# ARCH-017 repository manifest (Model-Traversal-and-Layout)
model:
  id: vercy.world-models
  name: Vercy world-model library
  version: 0.1.0
  status: working-draft
  license: Apache-2.0
  steward: Vercy project

# Reading order (dependency-first). Bundles here are logical: the catalogue
# layer at the root, then the deep specifications.
bundles:
  - id: architecture
    meaning: the catalogue and registers: what models exist, clusters, layering, status
    order:
      - README.md
      - World-Model-Architecture.md
      - world-models.csv
      - meta-models.csv
  - id: deep-specifications
    meaning: normative specifications of deepened models, dependency-first
    order:
      - models/Security-Ownership-and-Access.md
      - models/Registry-and-Ledger.md
      - models/Actions-and-Events.md
      - models/Offense-and-Enforcement.md
      - models/Property-and-Ownership.md
      - models/Civic-Health-and-Democracy.md
      - models/Economy-and-Markets.md

# Centralized classification (first match wins).
kind_rules:
  - pattern: "BOOTSTRAP.md"
    kind: bootstrap
    origin: authored
  - pattern: "manifest.yaml"
    kind: manifest
    origin: authored
  - pattern: "sources.yaml"
    kind: manifest
    origin: authored
  - pattern: "README.md"
    kind: doc
    origin: authored
  - pattern: "World-Model-Architecture.md"
    kind: doc
    origin: authored
  - pattern: "*.csv"
    kind: doc
    origin: authored
  - pattern: "models/*.md"
    kind: doc
    origin: authored

exclude:
  - LICENSE
  - .git/**
