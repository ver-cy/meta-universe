name: Validate MMAS data bindings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check check-jsonschema==0.33.3
      - name: Validate binding examples
        run: check-jsonschema --schemafile schemas/dataset-binding.schema.json examples/data-bindings/*.json
      - name: Validate coverage-proof schema
        run: check-jsonschema --check-metaschema schemas/coverage-proof.schema.json
      - name: Check specification index identifiers
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          text = Path("spec-index.yaml").read_text()
          ids = re.findall(r"^  - id: (\S+)", text, re.M)
          count = int(re.search(r"^documentCount: (\d+)", text, re.M).group(1))
          duplicates = [key for key, value in Counter(ids).items() if value > 1]
          assert count == len(ids), (count, len(ids))
          assert not duplicates, duplicates
          print(f"{count} unique indexed documents")
          PY
