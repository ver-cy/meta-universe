name: Apply local MMAS update

on:
  push:
    paths:
      - meta-universe-2.1.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply archive
        run: |
          unzip -o meta-universe-2.1.zip
          rm meta-universe-2.1.zip
          git config user.name "ver-cy automation"
          git config user.email "automation@ver.cy"
          git add -A -- . ':!.github/workflows/_apply-local-update.yml'
          git diff --cached --quiet || git commit -m "feat: define portable data bindings in MMAS 2.1"
          git push
