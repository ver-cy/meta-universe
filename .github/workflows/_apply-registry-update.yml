name: Apply registry update
on:
  push:
    paths:
      - meta-universe-registry-publish.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply archive
        run: |
          unzip -o meta-universe-registry-publish.zip
          rm meta-universe-registry-publish.zip
          git config user.name "ver-cy automation"
          git config user.email "automation@ver.cy"
          git add -A
          git diff --cached --quiet || git commit -m "registry: publish AISMM 3.2 under Vercy stewardship"
          git push
